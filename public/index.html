<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <div>
        <h1>Task Manager</h1>
        <p class="subtitle">Plan your day and keep progress visible.</p>
      </div>
      <div class="header-actions">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">🌙 Dark</button>
        <div class="summary" id="summary-card">
          <p><strong id="total-count">0</strong> tasks</p>
          <p><strong id="completed-count">0</strong> completed</p>
        </div>
      </div>
    </header>

    <form id="task-form" class="task-form">
      <input id="task-input" type="text" placeholder="What do you need to do?" aria-label="Task title" required />
      <button type="submit">Add Task</button>
    </form>

    <section class="toolbar" aria-label="Task filters">
      <button class="filter-btn active" data-filter="all" type="button">All</button>
      <button class="filter-btn" data-filter="active" type="button">Active</button>
      <button class="filter-btn" data-filter="completed" type="button">Completed</button>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <ul id="task-list" class="task-list"></ul>
  </main>

  <script src="app.js"></script>
</body>
</html>
